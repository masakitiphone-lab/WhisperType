name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || '' }}
          VITE_TRANSCRIBE_URL: ${{ vars.VITE_TRANSCRIBE_URL || 'http://127.0.0.1:8787' }}
          VITE_AUTH_REDIRECT_URL: ${{ vars.VITE_AUTH_REDIRECT_URL || 'whispertype://auth/callback' }}

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}

      - name: Build Tauri app
        run: pnpm tauri build --bundles dmg --target ${{ matrix.arch }}
        env:
          WHISPERTYPE_PLUS_STORE_ID: ${{ vars.WHISPERTYPE_PLUS_STORE_ID || '' }}
          WHISPERTYPE_TRANSCRIBE_HOST_ALLOWLIST: ${{ vars.WHISPERTYPE_TRANSCRIBE_HOST_ALLOWLIST || '' }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: whisper-type-${{ matrix.arch }}-${{ github.sha }}
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
