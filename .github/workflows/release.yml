name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
            rust_target: ""
          - platform: macos-14
            args: "--bundles dmg --target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
          - platform: macos-14
            args: "--bundles dmg --target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_target || 'windows' }}

      - name: Build and upload to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "WhisperType ${{ github.ref_name }}"
          releaseBody: |
            Automated release build.

            Download the installer for your platform:
            - Windows: NSIS setup (`.exe`)
            - macOS Intel: DMG (`x86_64`)
            - macOS Apple Silicon: DMG (`aarch64`)

            Installers are unsigned. Windows may show a SmartScreen warning and macOS may show a Gatekeeper warning.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
